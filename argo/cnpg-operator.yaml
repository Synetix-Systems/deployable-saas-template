# CloudNativePG operator + Barman Cloud plugin. Cluster-wide, ONE install per
# cluster (not per app). Apply once on the app cluster's Argo CD, BEFORE the
# app Application — the chart's Cluster/Pooler/ObjectStore/ScheduledBackup
# resources need these CRDs.
#
# The plugin does WAL archiving + base backups to S3 (in-tree barmanObjectStore
# is removed from CNPG). It needs cert-manager in the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "0" }
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.1          # operator 1.30.1
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true        # CNPG CRDs exceed the client-side annotation limit
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-barman-cloud
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: plugin-barman-cloud
    targetRevision: 0.8.1           # plugin v0.15.1
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system          # MUST be the operator's namespace
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
