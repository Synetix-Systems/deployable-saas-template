# Migrations + seed. As an Argo CD Sync hook in sync-wave 1 it runs AFTER infra
# (wave 0: CNPG db/pooler, redis, seaweedfs) and BEFORE the app Rollouts (wave 2), recreated
# on every sync. (A plain `helm install` runs it as an ordinary Job.)
# Connects DIRECTLY to Postgres (not via pgbouncer) so DDL/migrations aren't
# affected by transaction pooling.
apiVersion: batch/v1
kind: Job
metadata:
  name: prestart
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: { app.kubernetes.io/name: prestart }
    spec:
      {{- include "app.pullSecrets" . | nindent 6 }}
      restartPolicy: Never
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z db-rw 5432; do sleep 2; done
              until nc -z redis 6379; do sleep 2; done
      containers:
        - name: prestart
          image: {{ include "app.image.backend" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["bash", "scripts/prestart.sh"]
          envFrom:
            {{- include "app.envFrom" . | nindent 12 }}
          env:
            {{- include "app.dbEnv" . | nindent 12 }}
            # migrations bypass pgbouncer (direct to Postgres)
            - { name: POSTGRES_SERVER, value: db-rw }
            - { name: POSTGRES_PORT, value: "5432" }
