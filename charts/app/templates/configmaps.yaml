# Topology env (ConfigMap).
# Secrets live in the app-dotenv Secret, created out-of-band from .env (see
# deployment.md), NOT here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-env
  labels:
    {{- include "app.labels" . | nindent 4 }}
data:
  DOMAIN: {{ .Values.domain | quote }}
{{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
