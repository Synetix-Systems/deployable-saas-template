apiVersion: v1
kind: Service
metadata: { name: pgbouncer }
spec:
  selector: { app.kubernetes.io/name: pgbouncer }
  ports: [{ name: pgbouncer, port: 6432, targetPort: 6432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: pgbouncer }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: pgbouncer } }
  template:
    metadata: { labels: { app.kubernetes.io/name: pgbouncer } }
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z db 5432; do sleep 2; done"]
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          command: ["/bin/sh", "-c"]
          args:
            - export DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"; exec /pgbouncer/pgbouncer-entrypoint.sh
          ports: [{ containerPort: 6432 }]
          env:
            - { name: POOL_MODE, value: transaction }
            - { name: MAX_CLIENT_CONN, value: "200" }
            - { name: DEFAULT_POOL_SIZE, value: "20" }
            - { name: LISTEN_PORT, value: "6432" }
            - { name: AUTH_TYPE, value: scram-sha-256 }
            - { name: DB_HOST, value: db }
            - { name: DB_PORT, value: "5432" }
            - { name: POSTGRES_USER, valueFrom: { configMapKeyRef: { name: app-env, key: POSTGRES_USER } } }
            - { name: POSTGRES_DB,   valueFrom: { configMapKeyRef: { name: app-env, key: POSTGRES_DB } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: app-dotenv, key: POSTGRES_PASSWORD } } }
          volumeMounts:
            - { name: entrypoint, mountPath: /pgbouncer/pgbouncer-entrypoint.sh, subPath: pgbouncer-entrypoint.sh, readOnly: true }
          readinessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-p", "6432"] }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - { name: entrypoint, configMap: { name: pgbouncer-entrypoint, defaultMode: 0755 } }
