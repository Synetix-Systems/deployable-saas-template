apiVersion: v1
kind: Service
metadata:
  name: backend            # active service — Ingress targets this
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  selector: { app.kubernetes.io/name: backend }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: backend-preview    # preview service — green RS before promotion
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  selector: { app.kubernetes.io/name: backend }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  replicas: {{ .Values.backend.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: backend } }
  strategy:
    blueGreen:
      activeService: backend
      previewService: backend-preview
      autoPromotionEnabled: {{ .Values.rollouts.blueGreen.autoPromotionEnabled }}
      scaleDownDelaySeconds: {{ .Values.rollouts.blueGreen.scaleDownDelaySeconds }}
  template:
    metadata: { labels: { app.kubernetes.io/name: backend } }
    spec:
      {{- include "app.pullSecrets" . | nindent 6 }}
      initContainers:
        {{- include "app.waitForInfra" . | nindent 8 }}
      containers:
        - name: backend
          image: {{ include "app.image.backend" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["fastapi", "run", "--workers", "4", "app/main.py"]
          ports: [{ containerPort: 8000 }]
          envFrom:
            {{- include "app.envFrom" . | nindent 12 }}
          env:
            {{- include "app.dbEnv" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /api/v1/utils/health-check/, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet: { path: /api/v1/utils/health-check/, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
