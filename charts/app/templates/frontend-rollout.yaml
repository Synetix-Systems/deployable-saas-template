apiVersion: v1
kind: Service
metadata:
  name: frontend
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  selector: { app.kubernetes.io/name: frontend }
  ports: [{ name: http, port: 80, targetPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-preview
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  selector: { app.kubernetes.io/name: frontend }
  ports: [{ name: http, port: 80, targetPort: 80 }]
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: frontend } }
  strategy:
    blueGreen:
      activeService: frontend
      previewService: frontend-preview
      autoPromotionEnabled: {{ .Values.rollouts.blueGreen.autoPromotionEnabled }}
      scaleDownDelaySeconds: {{ .Values.rollouts.blueGreen.scaleDownDelaySeconds }}
  template:
    metadata: { labels: { app.kubernetes.io/name: frontend } }
    spec:
      {{- include "app.pullSecrets" . | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "app.image.frontend" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
