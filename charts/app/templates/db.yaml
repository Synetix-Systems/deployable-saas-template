apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: db
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db
    spec:
      {{- include "app.pullSecrets" . | nindent 6 }}
      containers:
        - name: postgres
          image: {{ include "app.image.postgres" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - postgres
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
            - -c
            - wal_level=replica
            - -c
            - archive_mode=on
            - -c
            - archive_command=wal-g wal-push %p
            - -c
            - archive_timeout=60
            - -c
            - max_wal_senders=3
            - -c
            - wal_keep_size=256
            # Auto-kill sessions stuck "idle in transaction" — they hold locks
            # that queue migrations and all traffic behind them.
            - -c
            - idle_in_transaction_session_timeout=300000
          ports: [{ containerPort: 5432 }]
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: POSTGRES_USER, valueFrom: { configMapKeyRef: { name: app-env, key: POSTGRES_USER } } }
            - { name: POSTGRES_DB,   valueFrom: { configMapKeyRef: { name: app-env, key: POSTGRES_DB } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: app-dotenv, key: POSTGRES_PASSWORD } } }
            # WAL-G archiving target (external S3).
            - { name: WALG_S3_PREFIX, value: {{ .Values.walg.s3Prefix | quote }} }
            - { name: AWS_ENDPOINT, value: {{ .Values.walg.endpoint | quote }} }
            - { name: AWS_S3_FORCE_PATH_STYLE, value: {{ .Values.walg.forcePathStyle | quote }} }
            - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: app-dotenv, key: S3_ACCESS_KEY_ID } } }
            - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: app-dotenv, key: S3_SECRET_ACCESS_KEY } } }
            - { name: AWS_REGION, value: {{ .Values.env.S3_REGION | quote }} }
            - { name: WALG_COMPRESSION_METHOD, value: {{ .Values.walg.compression | quote }} }
            - { name: WALG_UPLOAD_CONCURRENCY, value: {{ .Values.walg.uploadConcurrency | quote }} }
            - { name: WALG_RETAIN_FULL, value: {{ .Values.walg.retainFull | quote }} }
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
            - { name: pg-hba, mountPath: /etc/postgresql/pg_hba.conf, subPath: pg_hba.conf, readOnly: true }
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" && psql -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -c 'SELECT 1' -q --no-align --tuples-only | grep -q 1"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 30
            periodSeconds: 15
        - name: pgbackup
          image: {{ include "app.image.postgres" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "/pgbackup-entrypoint.sh"]
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: POSTGRES_HOST, value: "127.0.0.1" }
            - { name: POSTGRES_PORT, value: "5432" }
            - { name: POSTGRES_USER, valueFrom: { configMapKeyRef: { name: app-env, key: POSTGRES_USER } } }
            - { name: POSTGRES_DB,   valueFrom: { configMapKeyRef: { name: app-env, key: POSTGRES_DB } } }
            - { name: BACKUP_SCHEDULE, value: {{ .Values.walg.backupSchedule | quote }} }
            - { name: WALG_S3_PREFIX, value: {{ .Values.walg.s3Prefix | quote }} }
            - { name: AWS_ENDPOINT, value: {{ .Values.walg.endpoint | quote }} }
            - { name: AWS_S3_FORCE_PATH_STYLE, value: {{ .Values.walg.forcePathStyle | quote }} }
            - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: app-dotenv, key: S3_ACCESS_KEY_ID } } }
            - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: app-dotenv, key: S3_SECRET_ACCESS_KEY } } }
            - { name: AWS_REGION, value: {{ .Values.env.S3_REGION | quote }} }
            - { name: WALG_COMPRESSION_METHOD, value: {{ .Values.walg.compression | quote }} }
            - { name: WALG_UPLOAD_CONCURRENCY, value: {{ .Values.walg.uploadConcurrency | quote }} }
            - { name: WALG_RETAIN_FULL, value: {{ .Values.walg.retainFull | quote }} }
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
            - { name: pgbackup-script, mountPath: /pgbackup-entrypoint.sh, subPath: pgbackup-entrypoint.sh, readOnly: true }
      volumes:
        - { name: pg-hba, configMap: { name: postgres-conf } }
        - { name: pgbackup-script, configMap: { name: pgbackup-entrypoint, defaultMode: 0755 } }
  volumeClaimTemplates:
    - metadata: { name: pgdata }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.storage.storageClass }}
        storageClassName: {{ .Values.storage.storageClass | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.storage.dbSize }} } }
