# CloudNativePG cluster + PgBouncer pooler + continuous backup to S3.
# Needs the CNPG operator and the Barman Cloud plugin (argo/cnpg-operator.yaml).
#
# Services the operator makes: db-rw (primary), db-ro, db-r, pgbouncer (pooler).
# Credentials: the operator generates Secret db-app (username/password); app
# pods read it via app.dbEnv — no POSTGRES_PASSWORD in app-dotenv.
#
# Backups: WAL is archived continuously + a daily base backup → any point in
# time inside `backup.retention` is restorable. Restore = db.restore (see
# deployment.md "Database restore").
{{- $db := .Values.db }}
{{- if and $db.restore.fromServerName (eq $db.restore.fromServerName $db.serverName) }}
{{- fail "db.restore.fromServerName must differ from db.serverName — bump db.serverName so the restored cluster archives to a new folder" }}
{{- end }}
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: db-backup
spec:
  retentionPolicy: {{ .Values.backup.retention | quote }}
  configuration:
    destinationPath: {{ .Values.backup.destinationPath | quote }}
    {{- if .Values.backup.endpointURL }}
    endpointURL: {{ .Values.backup.endpointURL | quote }}
    {{- end }}
    s3Credentials:
      accessKeyId: { name: {{ .Values.backup.credentialsSecret }}, key: S3_ACCESS_KEY_ID }
      secretAccessKey: { name: {{ .Values.backup.credentialsSecret }}, key: S3_SECRET_ACCESS_KEY }
    wal: { compression: gzip, maxParallel: 2 }
    data: { compression: gzip }
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: db
spec:
  instances: {{ $db.instances }}
  imageName: {{ $db.image | quote }}
  storage:
    size: {{ .Values.storage.dbSize }}
    {{- if .Values.storage.storageClass }}
    storageClass: {{ .Values.storage.storageClass | quote }}
    {{- end }}
  postgresql:
    parameters:
      # Auto-kill sessions stuck "idle in transaction" — they hold locks that
      # queue migrations and all traffic behind them.
      idle_in_transaction_session_timeout: "300000"
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: db-backup
        serverName: {{ $db.serverName | quote }}
  bootstrap:
    {{- if $db.restore.fromServerName }}
    recovery:
      source: origin
      database: {{ .Values.env.POSTGRES_DB }}
      owner: {{ .Values.env.POSTGRES_DB }}
      {{- if $db.restore.targetTime }}
      recoveryTarget:
        targetTime: {{ $db.restore.targetTime | quote }}
      {{- end }}
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: db-backup
          serverName: {{ $db.restore.fromServerName | quote }}
    {{- else }}
    initdb:
      database: {{ .Values.env.POSTGRES_DB }}
      owner: {{ .Values.env.POSTGRES_DB }}
    {{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: db-daily
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  immediate: true                    # first base backup right after creation
  backupOwnerReference: self
  cluster: { name: db }
  method: plugin
  pluginConfiguration: { name: barman-cloud.cloudnative-pg.io }
---
# Transaction pooling for the app. Migrations bypass it (prestart → db-rw).
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: pgbouncer
spec:
  cluster: { name: db }
  instances: 1
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "200"
      default_pool_size: "20"
