# Single-environment values (this is the only env — there is no dev/prod split).
# Argo CD on the target cluster renders the chart with this file
# (see ../../argo/application.yaml). EDIT the placeholders below per project.

namespace: app

image:
  # Harbor over the tailnet (host tailscaled + MagicDNS → pods resolve *.ts.net
  # via the coredns-custom forward). Same build server + Harbor as your other
  # projects; only the project path differs.
  registry: harbor.tail41bc66.ts.net
  pullPolicy: Always
  pullSecret: regcred                 # docker-registry Secret with Harbor creds
  backend:
    repo: your-project/backend        # CHANGE ME (Harbor project path)
    tag: latest                       # CI pushes :latest + :<sha>; updater watches :latest digest
    image: ""                         # full ref — Argo Image Updater writes here (digest-safe)
  frontend:
    repo: your-project/frontend       # CHANGE ME
    tag: latest
    image: ""                         # full ref — Argo Image Updater writes here

# Public host. Single host, path routing: /api → backend, / → frontend.
domain: app.example.com               # CHANGE ME

ingress:
  enabled: true
  className: traefik                  # k3s default ingress controller
  entrypoint: websecure
  certResolver: le                   # Traefik ACME resolver; or use cert-manager below
  certManagerIssuer: ""              # if set, uses cert-manager instead of Traefik certResolver
  tlsSecretName: app-tls

# Argo Rollouts strategy knobs.
rollouts:
  blueGreen:
    scaleDownDelaySeconds: 30         # how long the old ReplicaSet lingers after promotion
    autoPromotionEnabled: true        # auto-promote once preview is healthy (Image-Updater-driven)
  canary:
    maxSurge: 1
    maxUnavailable: 0

backend:
  replicas: 2

frontend:
  replicas: 2

# MAX warm-shutdown drain window (sec) before SIGKILL, applied to every worker.
# CEILING, not a fixed wait: Celery exits the moment in-flight tasks finish
# (idle worker exits in ~1s on deploy). Must exceed your longest task so a
# deploy never SIGKILLs a task mid-run. Per-worker override via
# workers.<queue>.gracePeriod.
workersGracePeriod: 600

# One Rollout per queue. Names MUST match the queues in app/celery_app.py
# task_routes. concurrency = worker processes per pod.
workers:
  default: { concurrency: 4, replicas: 1 }
  emails:  { concurrency: 2, replicas: 1 }

beat:
  enabled: true

storage:
  dbSize: 20Gi
  redisSize: 5Gi
  seaweedfsSize: 20Gi
  storageClass: ""                    # "" = cluster default (k3s local-path)

# CloudNativePG cluster (templates/db.yaml). Needs argo/cnpg-operator.yaml.
db:
  instances: 1                        # >1 = streaming replicas + automatic failover
  image: ghcr.io/cloudnative-pg/postgresql:18
  # Folder for this cluster's WAL + base backups inside backup.destinationPath.
  # Bump it (db-2, db-3, ...) on every restore — a new timeline needs an empty folder.
  serverName: db
  # Point-in-time restore. Bootstrap only runs when the Cluster is CREATED, so
  # setting this alone does nothing — follow deployment.md "Database restore".
  restore:
    fromServerName: ""                # serverName to restore FROM ("" = fresh initdb)
    targetTime: ""                    # RFC3339, e.g. "2026-10-05T14:30:00Z"; "" = latest WAL

# CNPG backups (Barman Cloud plugin): continuous WAL archive + scheduled base
# backups. Credentials Secret must hold S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY.
backup:
  destinationPath: s3://backups       # bucket (+ optional prefix)
  endpointURL: http://seaweedfs:8333     # "" = real AWS S3; off-site B2/S3 for real DR
  credentialsSecret: app-dotenv
  retention: 30d                      # PITR window; older base backups + WAL pruned
  schedule: "0 0 3 * * *"             # six-field cron (sec first) — 03:00 daily

# In-cluster SeaweedFS (templates/seaweedfs.yaml): app uploads + backup target.
seaweedfs:
  enabled: true
  image: chrislusf/seaweedfs:4.48
  buckets: [app, backups]             # must include env.S3_BUCKET_NAME + backup bucket

# Non-secret topology env (ConfigMap, LAST in envFrom → overrides the .env
# Secret). Only put here: (1) topology the chart must force (service
# hostnames/ports), (2) keys other templates read (POSTGRES_DB = CNPG db + owner).
# POSTGRES_USER/PASSWORD come from the CNPG Secret db-app (app.dbEnv).
# User prefs (PROJECT_NAME, SMTP_*, API keys) stay OUT — they come from the Secret.
env:
  ENVIRONMENT: production
  POSTGRES_SERVER: pgbouncer          # CNPG Pooler; prestart overrides to db-rw
  POSTGRES_PORT: "5432"
  POSTGRES_DB: app
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  S3_ENDPOINT_URL: http://seaweedfs:8333  # in-chart SeaweedFS; "" = real AWS S3
  S3_BUCKET_NAME: app
  S3_REGION: us-east-1
  FRONTEND_HOST: https://app.example.com          # CHANGE ME (matches domain)
  BACKEND_CORS_ORIGINS: https://app.example.com   # CHANGE ME
