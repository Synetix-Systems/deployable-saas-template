# Local development stack ONLY. Production runs on k3s via the Helm chart in
# charts/app (see deployment.md). This file mirrors the cluster topology
# (Postgres, Redis, SeaweedFS, Celery workers + beat) so the app behaves the same
# locally. Start it with `docker compose watch` (see development.md).

# Shared backend env — the same image runs the API, prestart, workers, and beat.
x-backend-env: &backend-env
  DOMAIN: ${DOMAIN}
  FRONTEND_HOST: ${FRONTEND_HOST?Variable not set}
  ENVIRONMENT: ${ENVIRONMENT}
  BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
  SECRET_KEY: ${SECRET_KEY?Variable not set}
  FIRST_SUPERUSER: ${FIRST_SUPERUSER?Variable not set}
  FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD?Variable not set}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
  POSTGRES_SERVER: db
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER?Variable not set}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
  SENTRY_DSN: ${SENTRY_DSN}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  S3_ENDPOINT_URL: http://seaweedfs:8333
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-admin}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-adminadmin}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-app}
  S3_REGION: ${S3_REGION:-us-east-1}

services:

  db:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - app-redis-data:/data

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: always
    command: ["server", "-s3", "-ip.bind=0.0.0.0"]
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-admin}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-adminadmin}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - app-seaweedfs-data:/data

  prestart:
    image: 'full-stack-fastapi-backend:${TAG-latest}'
    build:
      context: .
      dockerfile: backend/Dockerfile
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment: *backend-env

  backend:
    image: 'full-stack-fastapi-backend:${TAG-latest}'
    restart: always
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment: *backend-env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5
    build:
      context: .
      dockerfile: backend/Dockerfile

  worker:
    image: 'full-stack-fastapi-backend:${TAG-latest}'
    restart: always
    networks:
      - default
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Local dev: one worker consumes every queue. In the cluster each queue is
    # its own Rollout (see charts/app/values.yaml `workers`).
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info", "-Q", "default,emails"]
    env_file:
      - .env
    environment: *backend-env
    build:
      context: .
      dockerfile: backend/Dockerfile

  beat:
    image: 'full-stack-fastapi-backend:${TAG-latest}'
    restart: always
    networks:
      - default
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info", "--scheduler", "celery.beat.PersistentScheduler", "--schedule", "/tmp/celerybeat-schedule"]
    env_file:
      - .env
    environment: *backend-env
    build:
      context: .
      dockerfile: backend/Dockerfile

  frontend:
    image: 'full-stack-fastapi-frontend:${TAG-latest}'
    restart: always
    networks:
      - default
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=https://${DOMAIN?Variable not set}
        - NODE_ENV=production

volumes:
  app-db-data:
  app-redis-data:
  app-seaweedfs-data:
